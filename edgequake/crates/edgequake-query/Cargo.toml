[package]
name = "edgequake-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Query engine for EdgeQuake RAG system"

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
edgequake-storage = { path = "../edgequake-storage", default-features = false }
edgequake-llm = { workspace = true }

# Embedded graph-core: the sandbox demo query path reranks IN THIS PROCESS,
# so the reranker is a linked library, not an HTTP service. Only the Candle
# backend and the EdgeQuake DTO adapter are enabled — none of the AWS,
# pgvector, Redis, or Ollama adapters are pulled in, and nothing here can
# make a network call.
#
# Pinned to itsm-graph-core 06f8fd112c65644f1f04d567dcb23bf3f90e3480
# ("feat(serving): embedded, fail-closed graph-core runtime for in-process
# rerank"). This is a documented sibling-checkout path dependency for the
# one-day demo build; the committed integration should ultimately pin a
# graph-core revision through a git dependency.
itsm-graph-core = { path = "../../../../itsm-graph-core/crates/itsm-graph-core", default-features = false, features = [
    "backend-candle",
    "adapter-edgequake",
] }

async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures = "0.3"

# SOTA keyword extraction dependencies
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
], optional = true }

tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json.workspace = true
edgequake-pipeline = { path = "../edgequake-pipeline" }
edgequake-core = { path = "../edgequake-core" }
async-trait.workspace = true
chrono = { workspace = true }
uuid.workspace = true
