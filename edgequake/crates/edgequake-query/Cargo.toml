[package]
name = "edgequake-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Query engine for EdgeQuake RAG system"

[features]
default = []
postgres = ["dep:sqlx"]
# CrystalOS sandbox demo: the embedded graph-core rerank path. Pulls in the
# private itsm-graph-core git dependency, so it is never on by default.
sandbox-demo = ["dep:itsm-graph-core"]

[dependencies]
edgequake-storage = { path = "../edgequake-storage", default-features = false }
edgequake-llm = { workspace = true }

# Embedded graph-core: the sandbox demo query path reranks IN THIS PROCESS,
# so the reranker is a linked library, not an HTTP service. Only the Candle
# backend is enabled — none of the AWS adapters are pulled in, and nothing
# here can make a network call.
#
# OPTIONAL, behind the `sandbox-demo` feature (off by default): graph-core is
# a private repository, so the default build — public CI, edgequake-main —
# never resolves into it at compile time.
#
# Pinned to crystalos-ai/itsm-graph-core main @ 9985e778651b4336affa3ad25be59695e3d5164d.
# To develop against a local checkout instead, add to the WORKSPACE root
# Cargo.toml (edgequake/Cargo.toml), without committing it:
#
#   [patch."https://github.com/crystalos-ai/itsm-graph-core"]
#   itsm-graph-core = { path = "../../itsm-graph-core/crates/itsm-graph-core" }
itsm-graph-core = { git = "https://github.com/crystalos-ai/itsm-graph-core", rev = "9985e778651b4336affa3ad25be59695e3d5164d", default-features = false, features = [
    "backend-candle",
], optional = true }

async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures = "0.3"

# SOTA keyword extraction dependencies
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
], optional = true }

[dev-dependencies]
# Only the sandbox-demo unit tests use it (they write activation bundles);
# unit tests in src/ see dev-dependencies, so it does not belong above.
tempfile = "3"
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json.workspace = true
edgequake-pipeline = { path = "../edgequake-pipeline" }
edgequake-core = { path = "../edgequake-core" }
async-trait.workspace = true
chrono = { workspace = true }
uuid.workspace = true
